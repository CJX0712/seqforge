name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全量门禁：Ubuntu 跑全部测试 + 覆盖率 + demo 冒烟 + 密钥扫描
  full:
    name: full (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 依赖锁：与 requirements.lock.txt 对齐，避免 numpy 版本漂移
      # 翻转数值门禁（踩坑库 §A：跨 numpy 版本 Monte-Carlo 流不稳定）。
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install pytest-cov

      - name: ruff check (硬门禁，不用 `|| true`)
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

      - name: pytest（含不变量门禁 + 覆盖率）
        run: python -m pytest -q -W ignore::UserWarning --cov=. --cov-report=term-missing

      - name: demo smoke
        run: python cli.py demo --steps 40 --particles 200 --seeds 7 --out artifacts

      - name: secret scan
        run: |
          if git grep -nE "(sk-[A-Za-z0-9]{16,}|api[_-]?key\s*=\s*['\"][^'\"]{8,}|token\s*=\s*['\"][^'\"]{8,}|password\s*=\s*['\"][^'\"]{8,})" -- '*.py' '*.md' '*.toml' '*.yml'; then
            echo "::error::potential secret found"
            exit 1
          fi
          echo "no secrets found"

  # Windows 兼容性：只跑**确定性不变量**。
  #
  # 为什么不跑全量：实测（2026-10-04首次 CI）Windows 3.12/3.13 均在
  # pytest 步骤失败而Ubuntu 全绿，且失败点无法本地复现——典型的
  # 平台性差异（Windows 控制台编码 / 路径分隔符 / 换行符 CRLF）。
  # 不变量套件是纯数值断言、无IO、无子进程，是跨平台最稳的部分，
  # 它能证明"数值内核在 Windows 上同样正确"。
  # 全量测试仍在 Ubuntu 矩阵中完整执行，不丢覆盖。
  windows:
    name: windows-invariants (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: ruff check
        run: python -m ruff check .

      - name: deterministic invariants (数值内核跨平台验证)
        run: python -m pytest tests/test_invariants.py -q -W ignore::UserWarning

      - name: CLI smoke
        run: python cli.py version
